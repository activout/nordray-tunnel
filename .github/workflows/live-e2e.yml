# Live end-to-end test against the real Bunny account. Manual only: it
# creates billable resources (per transport a Magic Containers app, pull
# zones, a Shield zone and, for anycast, an IPv4 for about ten minutes) and
# tears them down again.
#
# Requires the environment "live-bunny" with the secret BUNNY_API_KEY.
#
# By default both transports run side by side, as separate installations
# (ci-wss, ci-anycast) with their own hostnames,
# e2e-<run id>-<transport>.nordray.net, so repeated runs do not hit the
# per-hostname certificate limit. For a quick check that only upgrades the
# standing installation, use live-quick instead.
#
# Cautions:
# - Each installation leaves a free Shield zone behind: the Shield API
#   cannot delete them.
# - If destroy fails, the job's state.json artifact identifies every
#   resource by ID. Put it in the user configuration directory as
#   nordray-tunnel/ci-<transport>/state.json and run:
#   nordray-tunnel destroy --name ci-<transport>
name: live-e2e

on:
  workflow_dispatch:
    inputs:
      transport:
        description: Transports to test (anycast attaches a paid IPv4 for about ten minutes)
        type: choice
        options: [both, wss, anycast]
        default: both
      region:
        description: Magic Containers region
        type: string
        default: DK

# One run at a time, and never cancel a run part-way: that could leave
# resources without state to delete them by.
concurrency:
  group: live-bunny
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  RELAY_IMAGE: ghcr.io/activout/nordray-tunnel-relay:sha-${{ github.sha }}

jobs:
  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the relay image for this commit
        uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64
          push: true
          tags: ${{ env.RELAY_IMAGE }}

  live:
    needs: relay-image
    runs-on: ubuntu-latest
    environment: live-bunny
    timeout-minutes: 45
    strategy:
      # Never let one transport's failure cancel the other part-way.
      fail-fast: false
      matrix:
        transport: ${{ fromJSON(inputs.transport == 'both' && '["wss","anycast"]' || format('["{0}"]', inputs.transport)) }}
    env:
      INSTALLATION: ci-${{ matrix.transport }}
      LIVE_HOSTNAME: e2e-${{ github.run_id }}-${{ matrix.transport }}.nordray.net
      NORDRAY_TUNNEL_SECRET_STORE: file
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Keep CLI state in a known place
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          echo "STATE_FILE=$RUNNER_TEMP/config/nordray-tunnel/$INSTALLATION/state.json" >> "$GITHUB_ENV"

      - name: Build the CLI and the fixture, install frpc
        run: |
          go build -o nordray-tunnel ./cmd/nordray-tunnel
          go build -o fixture ./e2e/fixture
          ./nordray-tunnel install-frpc -o .bin

      - name: Start the private service
        run: nohup ./fixture -addr 127.0.0.1:18081 > fixture.log 2>&1 &

      - name: setup
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          REGION: ${{ inputs.region }} # via env, never spliced into the script
        run: >-
          ./nordray-tunnel setup --name "$INSTALLATION" --yes --api-key-env BUNNY_API_KEY
          --region "$REGION" --transport "${{ matrix.transport }}" --image "$RELAY_IMAGE"

      - name: add
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: ./nordray-tunnel add web --name "$INSTALLATION" --hostname "$LIVE_HOSTNAME" --local http://127.0.0.1:18081 --api-key-env BUNNY_API_KEY

      - name: run (agent, without the Bunny API key)
        run: |
          nohup ./nordray-tunnel run --name "$INSTALLATION" --frpc .bin/frpc > agent.log 2>&1 &
          for i in $(seq 1 30); do
            ./nordray-tunnel status --name "$INSTALLATION" | grep -q '\[running\]' && break
            sleep 2
          done
          ./nordray-tunnel status --name "$INSTALLATION"
          if ! ./nordray-tunnel status --name "$INSTALLATION" | grep -q '\[running\]'; then
            echo "::error::the agent did not connect; see agent.log"; exit 1
          fi

      - name: setup again changes nothing
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          ./nordray-tunnel setup --name "$INSTALLATION" --yes --api-key-env BUNNY_API_KEY | tee rerun.log
          if grep -qE '^(Created|Deleted|Updated)' rerun.log; then
            echo "::error::an unchanged setup changed resources"; exit 1
          fi

      - name: Live checks through Bunny CDN
        run: |
          export LIVE_DEFAULT_HOST="$(jq -r '.appPullZoneName' "$STATE_FILE").b-cdn.net"
          go test -tags live ./e2e/live -count=1 -v

      - name: status --remote
        if: always()
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: ./nordray-tunnel status --name "$INSTALLATION" --remote --api-key-env BUNNY_API_KEY || true

      - name: Keep state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-${{ github.run_id }}-${{ matrix.transport }}
          path: |
            ${{ env.STATE_FILE }}
            agent.log
            fixture.log
          if-no-files-found: ignore

      - name: destroy
        if: always()
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          pkill -f 'nordray-tunnel run' || true
          if [ -f "$STATE_FILE" ]; then
            ./nordray-tunnel destroy --name "$INSTALLATION" --yes --api-key-env BUNNY_API_KEY
          fi
