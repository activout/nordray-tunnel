# Release when a v* tag is pushed: test, push the relay image
# ghcr.io/activout/nordray-tunnel-relay:<tag> (the CLI's default --image),
# build the CLI for six platforms, and publish SHA256SUMS and build
# provenance attestations. Verify a download with:
#   gh attestation verify nordray-tunnel_<version>_<os>_<arch> --repo activout/nordray-tunnel
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go run ./cmd/nordray-tunnel install-frpc -o .bin --frps
          go vet ./...
          go test ./... -count=1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the relay image
        uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/activout/nordray-tunnel-relay:${{ github.ref_name }}

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/nordray-tunnel_${VERSION}_${os}_${arch}${ext}" ./cmd/nordray-tunnel
          done
          (cd dist && sha256sum nordray-tunnel_* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/nordray-tunnel_*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "nordray-tunnel $GITHUB_REF_NAME"
