name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FRP_VERSION: 0.71.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch pinned frp and verify checksum
        run: |
          f=frp_${FRP_VERSION}_linux_amd64.tar.gz
          curl -fsSLO https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/$f
          curl -fsSL https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_sha256_checksums.txt | grep " $f\$" | sha256sum -c
          mkdir .bin && tar xzf $f -C .bin --strip-components=1
      - run: go vet ./...
      - run: go test ./... -count=1

  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build nordray-tunnel for ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0
          go build -trimpath -o dist/ ./cmd/nordray-tunnel
        env:
          TARGET: ${{ matrix.target }}
