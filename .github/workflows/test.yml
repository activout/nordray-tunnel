name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FRP_VERSION: 0.71.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch pinned frp and verify checksum
        run: |
          f=frp_${FRP_VERSION}_linux_amd64.tar.gz
          curl -fsSLO https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/$f
          curl -fsSL https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_sha256_checksums.txt | grep " $f\$" | sha256sum -c
          mkdir .bin && tar xzf $f -C .bin --strip-components=1
      - run: go vet ./...
      - run: go test ./... -count=1
