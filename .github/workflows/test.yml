name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pinned frp with nordray-tunnel itself
        run: go run ./cmd/nordray-tunnel install-frpc -o .bin --frps
      - run: go vet ./...
      - run: go test ./... -count=1

  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build nordray-tunnel for ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0
          go build -trimpath -o dist/ ./cmd/nordray-tunnel
        env:
          TARGET: ${{ matrix.target }}
